<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Discussion</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="layout">
  <section class="pane left-pane">
    <div class="left-header">
      <h2>Questions</h2>
      <button type="button" id="new-question-btn">New question</button>
    </div>
    <input type="text" id="search-input" placeholder="Search questions" aria-label="Search questions">
    <p id="empty-message">No questions yet.</p>
    <ul id="question-list"></ul>
  </section>

  <section class="pane right-pane" id="right-pane">
    <div id="question-view">
      <h2>Ask a question</h2>
      <form id="question-form">
        <label for="question-title">Title</label>
        <input type="text" id="question-title" required>

        <label for="question-text">Question</label>
        <textarea id="question-text" rows="6" required></textarea>

        <button type="submit" class="primary-btn">Submit</button>
      </form>
    </div>

    <div id="detail-view" hidden>
      <h2 id="detail-title"></h2>
      <div class="detail-question-row">
        <div id="detail-votes"></div>
        <p id="detail-question"></p>
      </div>
      <button type="button" id="resolve-btn" class="primary-btn">Resolve</button>

      <h3>Responses</h3>
      <p id="no-responses">No responses yet.</p>
      <ul id="response-list"></ul>

      <h3>Add a response</h3>
      <form id="response-form">
        <label for="response-name">Name</label>
        <input type="text" id="response-name" required>

        <label for="response-comment">Comment</label>
        <textarea id="response-comment" rows="4" required></textarea>

        <button type="submit" class="primary-btn">Submit</button>
      </form>
    </div>
  </section>
</div>
<script src="index.js"></script>
</body>
</html>
